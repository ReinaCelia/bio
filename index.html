<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reinaa - Link in Bio</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
:root {
  --bg-color: #e0e5ec;
  --text-color: #2d3748;
  --card-bg: rgba(255, 255, 255, 0.4);
  --card-border: rgba(255, 255, 255, 0.6);
  --accent-color: #667eea;
  --shadow-color: rgba(163, 177, 198, 0.6);
  --highlight-color: rgba(255, 255, 255, 0.8);
  --glass-blur: blur(12px);
}
[data-theme="dark"] {
  --bg-color: #1a202c;
  --text-color: #f7fafc;
  --card-bg: rgba(26, 32, 44, 0.5);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent-color: #9f7aea;
  --shadow-color: rgba(0, 0, 0, 0.5);
  --highlight-color: rgba(255, 255, 255, 0.05);
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  transition: background-color 0.4s ease, color 0.4s ease;
}
body {
  background-color: var(--bg-color);
  color: var(--text-color);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  position: relative;
}
.bg-animation {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: -1;
  overflow: hidden;
  background: linear-gradient(135deg, var(--bg-color), var(--accent-color));
  opacity: 0.15;
}
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  animation: float 10s infinite ease-in-out;
}
.blob-1 {
  width: 300px;
  height: 300px;
  background: #ff9a9e;
  top: -100px;
  left: -100px;
  animation-delay: 0s;
}
.blob-2 {
  width: 400px;
  height: 400px;
  background: #a18cd1;
  bottom: -150px;
  right: -100px;
  animation-delay: -5s;
}
@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -50px) scale(1.1); }
  66% { transform: translate(-20px, 20px) scale(0.9); }
}
.container {
  width: 100%;
  max-width: 480px;
  padding: 40px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 1;
}
.theme-switch-wrapper {
  position: absolute;
  top: 20px;
  right: 20px;
  z-index: 10;
}
.theme-toggle-btn {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  color: var(--text-color);
  font-size: 1.2rem;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 4px 4px 10px var(--shadow-color), -4px -4px 10px var(--highlight-color);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.theme-toggle-btn:hover {
  transform: scale(1.1);
}
.profile-section {
  text-align: center;
  margin-bottom: 40px;
  animation: fadeInUp 1s ease forwards;
  opacity: 0;
  transform: translateY(20px);
}
.profile-img-container {
  position: relative;
  width: 120px;
  height: 120px;
  margin: 0 auto 20px;
}
.profile-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  border: 4px solid var(--card-border);
  box-shadow: 6px 6px 15px var(--shadow-color), -6px -6px 15px var(--highlight-color);
  padding: 4px;
  background: var(--bg-color);
}
.profile-name {
  font-size: 1.8rem;
  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.profile-bio {
  font-size: 1rem;
  opacity: 0.8;
  line-height: 1.5;
}
.links-section {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.link-card {
  text-decoration: none;
  color: var(--text-color);
  background: var(--card-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--card-border);
  padding: 16px 24px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  font-weight: 600;
  font-size: 1.1rem;
  box-shadow: 5px 5px 15px var(--shadow-color), -5px -5px 15px var(--highlight-color);
  transition: all 0.3s ease;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeInUp 0.8s ease forwards;
}
.link-card:hover {
  transform: translateY(-5px);
  box-shadow: 8px 8px 20px var(--shadow-color), -8px -8px 20px var(--highlight-color);
  background: var(--accent-color);
  color: #ffffff;
  border-color: transparent;
}
.link-icon {
  font-size: 1.4rem;
  margin-right: 16px;
  width: 30px;
  text-align: center;
}
.link-text {
  flex-grow: 1;
  text-align: center;
  padding-right: 46px;
}
@keyframes fadeInUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>
<body>
<div class="bg-animation">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>
<div class="theme-switch-wrapper">
  <button class="theme-toggle-btn" id="themeToggle">
    <i class="fas fa-moon"></i>
  </button>
</div>
<div class="container">
  <div class="profile-section">
    <div class="profile-img-container">
      <img src="https://i.ibb.co/qYNXfcTt/1777326031776.jpg" alt="Profile" class="profile-img">
    </div>
    <h1 class="profile-name">Reinaa</h1>
    <p class="profile-bio">Hiiii! I’m Reinaaaa and I’m definitely the cutest girl you'll see today... just kidding. or am I? 😜 <br> Welcome to my space 💞</p>
  </div>
  <div class="links-section" id="linksContainer">
    <a href="https://github.com/ReinaCelia" class="link-card" style="animation-delay: 0.2s;">
      <i class="fab fa-instagram link-icon"></i>
      <span class="link-text">Instagram</span>
    </a>
    <a href="https://github.com/ReinaCelia" class="link-card" style="animation-delay: 0.3s;">
      <i class="fab fa-twitter link-icon"></i>
      <span class="link-text">Twitter</span>
    </a>
    <a href="https://github.com/ReinaCelia" class="link-card" style="animation-delay: 0.4s;">
      <i class="fab fa-linkedin-in link-icon"></i>
      <span class="link-text">LinkedIn</span>
    </a>
    <a href="https://github.com/ReinaCelia" class="link-card" style="animation-delay: 0.5s;">
      <i class="fab fa-github link-icon"></i>
      <span class="link-text">GitHub</span>
    </a>
    <a href="https://github.com/ReinaCelia" class="link-card" style="animation-delay: 0.6s;">
      <i class="fas fa-envelope link-icon"></i>
      <span class="link-text">Contact Me</span>
    </a>
  </div>
</div>
<script>
const themeToggleBtn = document.getElementById('themeToggle');
const rootElement = document.documentElement;
const icon = themeToggleBtn.querySelector('i');
let isDarkMode = false;
function switchTheme() {
  isDarkMode = !isDarkMode;
  if (isDarkMode) {
    rootElement.setAttribute('data-theme', 'dark');
    icon.classList.remove('fa-moon');
    icon.classList.add('fa-sun');
  } else {
    rootElement.removeAttribute('data-theme');
    icon.classList.remove('fa-sun');
    icon.classList.add('fa-moon');
  }
}
themeToggleBtn.addEventListener('click', switchTheme);
const linkCards = document.querySelectorAll('.link-card');
linkCards.forEach(card => {
  card.addEventListener('mouseenter', () => {
    const i = card.querySelector('i');
    i.style.transform = 'scale(1.2)';
    i.style.transition = 'transform 0.3s ease';
  });
  card.addEventListener('mouseleave', () => {
    const i = card.querySelector('i');
    i.style.transform = 'scale(1)';
  });
});
</script>
</body>
</html>
